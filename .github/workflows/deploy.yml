name: Deploy to VPS

on:
  workflow_dispatch:  # 只手动触发，pi_sync 已包含自动部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Build pages from templates
        run: python3 build.py

      - name: Deploy to VPS via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --delete --include='/*.html' --include='/ads.txt' --include='/robots.txt' --include='/*.xml' --include='/*.ico' --include='/blog/***' --include='/static/***' --include='/data/***' --exclude='*'
          path: ./
          remote_path: ${{ secrets.VPS_PATH }}/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_port: ${{ secrets.VPS_PORT }}
          remote_key: ${{ secrets.VPS_DEPLOY_KEY }}
