name: Pi Blog Auto-Sync Robot

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动巡逻一次
  workflow_dispatch: # 允许 Andy 在后台手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 curl_cffi

      - name: Run Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/pi_robot.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Pi Sync Robot"
          git config --global user.email "bot@pibizh.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Robot: 同步 MinePi.com 最新博文全文" && git push origin main)

      - name: Deploy to VPS
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --delete --exclude='.git' --exclude='.github' --exclude='scripts' --exclude='.user.ini'
          path: ./
          remote_path: ${{ secrets.VPS_PATH }}/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_port: ${{ secrets.VPS_PORT }}
          remote_key: ${{ secrets.VPS_DEPLOY_KEY }}
