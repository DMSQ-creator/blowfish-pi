<body class="min-h-screen">
    <nav class="p-6 border-b border-white/5 bg-[#0f021a]/80 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center"><a href="../../blog.html" class="font-bold">← 返回列表</a><span class="text-[#f4af47] font-black uppercase">Mainnet Anniversary</span></div>
    </nav>
    <main class="max-w-3xl mx-auto py-20 px-6">
        <div class="mb-12 rounded-[40px] overflow-hidden shadow-2xl"><img src="https://minepi.com/wp-content/uploads/2026/02/Pi-Network-1-900x600.jpg" class="w-full"></div>

        <article class="prose prose-invert max-w-none">
            <p class="text-xl text-gray-400 mb-12">从 2025 年 2 月 20 日主网正式开启以来，Pi Network 经历了历史上最波澜壮阔的一年。今天，我们用数据说话。</p>
            <div class="data-grid">

                <div class="data-card text-center"><div class="text-3xl font-black text-white">1500万+</div><p class="text-xs text-gray-500 uppercase mt-2">已迁移钱包数</p></div>
            </div>
            <p>这一年来，我们不仅完成了技术架构的升级，更在真实商业应用上取得了长足进步。成千上万的本地商家开始接受 Pi 作为支付方式，Pi 浏览器的日活用户也刷新了历史纪录。我们正在从‘采矿阶段’稳步迈向‘实用阶段’。</p>
