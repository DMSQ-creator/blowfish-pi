<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi 派币中文网 | 全球领先移动社交区块链</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f021a; color: white; margin: 0; font-family: sans-serif; overflow-x: hidden; }
        .pi-hero-bg {
            background: radial-gradient(circle at 20% 30%, rgba(89, 59, 139, 0.4) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(66, 63, 136, 0.3) 0%, transparent 50%);
        }
        .text-pi-gold {
            background: linear-gradient(90deg, #f4af47 0%, #fab44b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="pi-hero-bg min-h-screen">
    <!-- Navbar -->
    <nav class="fixed w-full z-50 px-6 py-5 bg-[#0f021a]/60 backdrop-blur-2xl border-b border-white/5">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-[#f4af47] to-[#fab44b] rounded-full flex items-center justify-center shadow-lg shadow-orange-500/20">
                    <span class="text-[#1e0a27] font-black text-2xl">π</span>
                </div>
                <span class="text-xl font-black tracking-tight uppercase">Pi 派币中文网</span>
            </div>
            <div class="hidden md:flex gap-10 text-[10px] font-black tracking-[0.2em] text-gray-400 uppercase">
                <a href="index.html" class="hover:text-[#f4af47] transition-colors font-bold">首页</a>
                <a href="blog.html" class="hover:text-[#f4af47] transition-colors font-bold">中文社区</a>
                <a href="#" class="hover:text-[#f4af47] transition-colors font-bold">生态节点</a>
                <a href="#" class="hover:text-[#f4af47] transition-colors font-bold">了解更多</a>
            </div>
            <a href="blog.html" class="bg-[#f4af47] text-[#1e0a27] px-8 py-2.5 rounded-full font-black text-xs hover:scale-105 transition-all">
                立即加入
            </a>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="relative flex flex-col items-center justify-center text-center pt-52 pb-32 px-6 max-w-6xl mx-auto">
        <div class="inline-block px-5 py-1.5 rounded-full bg-white/5 border border-white/10 text-[#f4af47] text-[10px] font-black tracking-[0.25em] uppercase mb-10">
            斯坦福博士团队打造
        </div>
        <h1 class="text-6xl md:text-[8rem] font-black mb-10 leading-[0.9] tracking-tighter">
            全球首个移动<br />
            <span class="text-pi-gold">区块链网络</span>
        </h1>
        <p class="text-xl md:text-2xl text-gray-400 max-w-2xl mx-auto mb-16 leading-relaxed font-medium">
            Pi 让加密货币挖掘变得简单。突破性技术让您在手机上零成本开启 Web3 资产之旅。
        </p>
        <div class="flex flex-col sm:flex-row justify-center gap-6">
            <a href="blog.html" class="bg-[#f4af47] text-[#1e0a27] px-16 py-6 rounded-2xl font-black text-xl hover:scale-110 transition-transform shadow-2xl shadow-orange-500/40 text-center">
                进入中文社区
            </a>
            <a href="#" class="border-2 border-white/10 hover:bg-white/5 px-16 py-6 rounded-2xl font-black text-xl transition-all text-white text-center">
                技术白皮书
            </a>
        </div>
    </main>

    <!-- Blog Area (Dynamic Injection) -->
    <section class="py-32 px-6 max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row items-center justify-between mb-20 gap-10">
            <div class="text-left border-l-4 border-[#f4af47] pl-6">
                <h2 class="text-6xl font-black tracking-tighter uppercase mb-4">资讯同步 <span class="text-[#f4af47]">BLOG</span></h2>
                <p class="text-gray-500 text-lg font-bold uppercase tracking-widest">Real-time Translation from MinePi.com</p>
            </div>
            <a href="blog.html" class="px-10 py-4 rounded-full border border-white/10 font-bold hover:bg-white hover:text-black transition-all">查看全部文章</a>
        </div>
        
        <div id="latest-news" class="grid md:grid-cols-2 gap-12 text-left">
            <!-- JS will inject news cards here -->
        </div>
    </section>

    <script>
        // 动态加载内容
        async function loadNews() {
            try {
                const response = await fetch('data/news.json');
                const news = await response.json();
                const container = document.getElementById('latest-news');
                
                container.innerHTML = news.map(item => `
                    <div class="p-12 rounded-[50px] bg-gradient-to-br from-white/10 to-transparent border border-white/10 hover:border-orange-500/40 transition-all group cursor-pointer" onclick="location.href='article.html?id=${item.id}'">
                        <div class="text-[#f4af47] font-black text-xs uppercase tracking-[0.3em] mb-10">${item.date} / 官方资讯</div>
                        <h3 class="text-4xl font-black mb-8 leading-tight group-hover:text-orange-400 transition-colors">${item.title}</h3>
                        <p class="text-gray-400 leading-relaxed text-xl mb-12">${item.excerpt}</p>
                        <div class="flex items-center gap-3">
                            <span class="text-white font-bold border-b border-white hover:text-[#f4af47] hover:border-[#f4af47] transition-all pb-1">阅读全文 →</span>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Failed to load news:', e);
            }
        }
        loadNews();
    </script>

    <footer class="py-20 text-center border-t border-white/5 opacity-50 font-black tracking-[0.5em] text-[10px]">
        © 2026 PI 派币中文社区网 · 开启 WEB3 社交时代
    </footer>
</body>
</html>
