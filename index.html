<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi 派币中文网 - 全球领先的移动社交区块链社区</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #1e0a27; color: white; font-family: 'Inter', sans-serif; margin: 0; }
        .hero-bg { background: linear-gradient(135deg, #1e0a27 0%, #423f88 100%); position: relative; overflow: hidden; }
        .text-pi-gold { background: linear-gradient(90deg, #f4af47 0%, #fab44b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .dropdown:hover .dropdown-menu { display: block; }
        .nav-link { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: #cbd5e1; transition: all 0.3s; }
        .nav-link:hover { color: #f4af47; }
    </style>
</head>
<body>
    <!-- Navbar (Fixed Links) -->
    <header class="fixed w-full z-50 bg-[#1e0a27]/90 backdrop-blur-xl border-b border-white/5">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='index.html'">
                <div class="w-10 h-10 bg-[#f4af47] rounded-full flex items-center justify-center shadow-lg"><span class="text-[#1e0a27] font-black text-2xl">π</span></div>
                <span class="text-xl font-black tracking-tighter uppercase">Pi 派币中文网</span>
            </div>
            
            <div class="hidden lg:flex items-center gap-10">
                <div class="dropdown relative group">
                    <button class="nav-link flex items-center gap-1 uppercase text-[#f4af47]">Pi 区块链 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></button>
                    <div class="dropdown-menu absolute hidden pt-4 w-48">
                        <div class="bg-[#2d1b3d] rounded-xl shadow-2xl border border-white/10 p-2">
                            <a href="nodes.html" class="block px-4 py-2 text-sm hover:bg-white/5 rounded-lg transition">Pi 节点 (Node)</a>
                            <a href="whitepaper.html" class="block px-4 py-2 text-sm hover:bg-white/5 rounded-lg transition">白皮书</a>
                        </div>
                    </div>
                </div>
                <a href="blog.html" class="nav-link uppercase">中文社区资讯</a>
            </div>

            <button class="bg-[#f4af47] text-[#1e0a27] px-8 py-2.5 rounded-full font-black text-xs hover:scale-105 transition-all">
                立即下载 App
            </button>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero-bg min-h-screen flex items-center pt-20 px-6">
        <div class="container mx-auto grid lg:grid-cols-2 gap-12 items-center text-left">
            <div>
                <h1 class="text-6xl md:text-8xl font-black mb-8 leading-[1.1] tracking-tighter">
                    首个在手机上<br />
                    <span class="text-pi-gold">轻松挖掘的货币</span>
                </h1>
                <p class="text-xl text-gray-400 max-w-xl mb-12">
                    Pi 让加密货币挖掘变得简单。斯坦福博士团队打造，开启你的 Web3 资产之旅。
                </p>
                <div class="flex gap-6">
                    <button class="bg-[#f4af47] text-[#1e0a27] px-12 py-5 rounded-2xl font-black text-xl hover:scale-105 transition-all" onclick="location.href='blog.html'">进入社区</button>
                    <button class="border-2 border-white/20 px-12 py-5 rounded-2xl font-black text-xl hover:bg-white/10 transition-all text-white" onclick="location.href='whitepaper.html'">查看白皮书</button>
                </div>
            </div>
            <div class="hidden lg:flex justify-end relative">
                <div class="w-80 h-[600px] bg-gradient-to-b from-[#f4af47] to-[#1e0a27] rounded-[50px] border-[10px] border-[#2d1b3d] shadow-2xl flex flex-col items-center justify-center p-6">
                    <div class="text-white font-black text-6xl mb-4">π</div>
                    <div class="text-[#f4af47] font-bold text-2xl">Mining...</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Blog Section (Dynamic Ready) -->
    <section class="py-24 px-6 bg-black/40 border-y border-white/5">
        <div class="container mx-auto">
            <h2 class="text-5xl font-black mb-12 uppercase border-l-4 border-[#f4af47] pl-6">最新同步内容</h2>
            <div id="latest-news" class="grid md:grid-cols-2 gap-10">
                <!-- Content will be here -->
            </div>
        </div>
    </section>

    <script>
        async function loadNews() {
            try {
                const response = await fetch('data/news.json');
                const news = await response.json();
                const container = document.getElementById('latest-news');
                container.innerHTML = news.map(item => `
                    <div class="p-10 rounded-[40px] bg-white/[0.03] border border-white/10 hover:border-orange-500/40 transition-all cursor-pointer" onclick="location.href='article.html?id=${item.id}'">
                        <div class="text-[#f4af47] text-xs mb-4 font-bold uppercase">${item.date}</div>
                        <h3 class="text-2xl font-bold mb-4">${item.title}</h3>
                        <p class="text-gray-400 mb-6">${item.excerpt}</p>
                        <span class="text-white border-b border-white pb-1 font-bold">查看全文 →</span>
                    </div>
                `).join('');
            } catch (e) {}
        }
        loadNews();
    </script>
</body>
</html>
