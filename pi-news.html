    <script>
        const btn = document.getElementById('m-btn');
        const close = document.getElementById('m-close');
        const menu = document.getElementById('mobile-menu');
        btn.onclick = () => menu.classList.add('open');
        close.onclick = () => menu.classList.remove('open');

        // 动态从 blog.html 抓取前 12 条资讯卡片
        (async () => {
            try {
                const res = await fetch('blog.html', { cache: 'no-store' });
                const html = await res.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const cards = Array.from(doc.querySelectorAll('#blog-grid > a.blog-card')).slice(0, 12);
                const grid = document.getElementById('news-blog-grid');
                if (!grid) return;

                if (cards.length === 0) {
                    grid.innerHTML = '<div class="text-gray-600 md:col-span-2">暂无文章，请稍后再试。</div>';
                    return;
                }

                grid.innerHTML = cards.map(a => {
                    const href = a.getAttribute('href') || 'blog.html';
                    const meta = a.querySelector('div')?.outerHTML || '';
                    const title = a.querySelector('h2')?.outerHTML || '';
                    const desc = a.querySelector('p')?.outerHTML || '';
                    return `<a href="${href}" class="blog-card block">${meta}${title}${desc}</a>`;
                }).join('');
            } catch (e) {
                const grid = document.getElementById('news-blog-grid');
                if (grid) grid.innerHTML = '<div class="text-gray-600 md:col-span-2">加载文章列表失败，请点击进入资讯中心查看。</div>';
                console.error(e);
            }
        })();
    </script>
